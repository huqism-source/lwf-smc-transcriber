<!DOCTYPE html>
<html lang="ur" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>LWF SMC Transcriber</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter+Tight:wght@400;500;600&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* ---------- LIGHT (default) ---------- */
  :root{
    --bg:#EEF4FB; --glow:#DCEAF9;
    --card:#FFFFFF; --card-2:#F7FAFE;
    --edge:#D5E3F2; --edge-soft:#E6EFF9;
    --blue:#0F76C4; --sky:#1D9BF0; --deep:#0A5D9E;
    --text:#0B2237; --muted:#5D7B96;
    --bad:#C2452A;
    --sheen:linear-gradient(105deg,transparent 38%,rgba(29,155,240,.20) 48%,rgba(29,155,240,.05) 56%,transparent 66%);
    --shadow:0 10px 30px rgba(11,45,80,.10);
    --row-hover:rgba(29,155,240,.06);
    --row-now:rgba(29,155,240,.13);
    --input:#F4F8FD;
    --ui:"Inter Tight",system-ui,sans-serif;
    --disp:"Bricolage Grotesque",system-ui,sans-serif;
    --urdu:"Noto Nastaliq Urdu",serif;
  }
  /* ---------- DARK ---------- */
  [data-theme="dark"]{
    --bg:#05101F; --glow:#12304F;
    --card:#0B1D31; --card-2:#102944;
    --edge:#1B3A5C; --edge-soft:#15304C;
    --blue:#1D9BF0; --sky:#7CC6FF; --deep:#0E6FB8;
    --text:#EAF4FF; --muted:#7C9AB8;
    --bad:#FF8A6B;
    --sheen:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.28) 48%,rgba(255,255,255,.05) 56%,transparent 66%);
    --shadow:0 14px 36px rgba(0,0,0,.42);
    --row-hover:rgba(124,198,255,.06);
    --row-now:rgba(29,155,240,.16);
    --input:rgba(5,16,31,.7);
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(900px 460px at 50% -8%,var(--glow) 0%,transparent 62%),var(--bg);
    color:var(--text);font-family:var(--ui);-webkit-font-smoothing:antialiased;min-height:100vh;
    transition:background-color .3s,color .3s;
  }
  html[lang="ur"] body{font-family:var(--urdu)}
  html[lang="ur"] .num,html[lang="ur"] .tm,html[lang="ur"] .jump{font-family:var(--ui)}
  .wrap{max-width:900px;margin:0 auto;padding:16px 14px 70px}

  /* ============ hero (dono themes mein gehra rehta hai) ============ */
  .hero{
    position:relative;overflow:hidden;border-radius:18px;
    background:linear-gradient(160deg,#14375C 0%,#0B1D31 55%,#061523 100%);
    border:1px solid rgba(124,198,255,.22);
    padding:20px 18px;box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.08);
  }
  .hero::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.26) 48%,rgba(255,255,255,.05) 56%,transparent 66%);
    transform:translateX(-120%);animation:sweep 6.5s ease-in-out infinite}
  @keyframes sweep{0%{transform:translateX(-120%)}55%,100%{transform:translateX(120%)}}
  .wave{position:absolute;inset:0;width:100%;height:100%;opacity:.17;pointer-events:none}
  .wave rect{fill:#7CC6FF;transform-origin:center;animation:pulse 1.5s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scaleY(.22)}50%{transform:scaleY(1)}}
  .hero-in{position:relative;z-index:2;display:flex;align-items:center;gap:14px}
  .crest{flex:0 0 auto;width:70px;height:70px;border-radius:50%;overflow:hidden;
    background:radial-gradient(circle,#fff 62%,rgba(124,198,255,.25) 100%);
    box-shadow:0 0 0 1px rgba(124,198,255,.45),0 0 24px rgba(29,155,240,.4)}
  .crest img{width:100%;height:100%;object-fit:contain;display:block}
  .hero h1{font-family:var(--disp);font-weight:800;font-size:clamp(19px,5.2vw,28px);margin:0;
    letter-spacing:-.02em;line-height:1.1;
    background:linear-gradient(92deg,#FFFFFF 12%,#7CC6FF 52%,#FFFFFF 88%);background-size:220% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;animation:glide 7s ease-in-out infinite}
  @keyframes glide{0%,100%{background-position:0% 0}50%{background-position:100% 0}}
  html[dir="rtl"] .hero h1{text-align:right}
  html[lang="ur"] .hero h1{font-family:var(--urdu);font-weight:600;letter-spacing:0;
    line-height:1.95;font-size:clamp(16px,4.4vw,23px);padding-block:2px}
  .hero p{margin:5px 0 0;font-size:11.5px;letter-spacing:.05em;color:#9DBBD6}
  html[lang="en"] .hero p{letter-spacing:.14em;text-transform:uppercase}
  .switches{position:absolute;z-index:3;top:14px;inset-inline-end:14px;display:flex;gap:6px}
  .sw{border:1px solid rgba(124,198,255,.35);background:rgba(5,16,31,.5);color:#DCEDFF;
    border-radius:8px;font-size:12px;padding:6px 10px;cursor:pointer;font-family:var(--ui);
    backdrop-filter:blur(4px);transition:border-color .2s,background .2s}
  .sw:hover{border-color:#7CC6FF;background:rgba(29,155,240,.25)}

  /* ============ cards ============ */
  .card{position:relative;margin-top:16px;border-radius:14px;border:1px solid var(--edge);
    background:linear-gradient(180deg,var(--card),var(--card-2));padding:18px 16px;overflow:hidden;
    box-shadow:var(--shadow)}
  .card::before{content:"";position:absolute;inset-block:0 auto;inset-inline:0;height:1px;
    background:linear-gradient(90deg,transparent,var(--sky),transparent);
    background-size:220% 100%;animation:edge 5s linear infinite}
  @keyframes edge{0%{background-position:-110% 0}100%{background-position:110% 0}}
  .cap{font-size:11.5px;letter-spacing:.06em;color:var(--muted);margin:0 0 12px}
  html[lang="en"] .cap{letter-spacing:.18em;text-transform:uppercase;font-size:11px}

  .drop{display:block;border:1px dashed var(--edge);border-radius:11px;padding:22px 16px;text-align:center;
    cursor:pointer;transition:border-color .2s,background .2s}
  .drop:hover{border-color:var(--blue);background:var(--row-hover)}
  .drop input{display:none}
  .drop b{display:block;font-size:17px;margin-bottom:6px;font-weight:600}
  html[lang="en"] .drop b{font-family:var(--disp)}
  html[lang="ur"] .drop b{line-height:2.1}
  .drop span{font-size:12.5px;color:var(--muted)}
  .picked{margin-top:12px;font-size:13px;color:var(--blue);word-break:break-all;direction:ltr}
  html[dir="rtl"] .picked{text-align:right}

  .opts{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:14px}
  button,select,input{font-family:inherit}
  .btn{position:relative;overflow:hidden;cursor:pointer;border-radius:9px;font-size:13.5px;font-weight:500;
    border:1px solid var(--edge);background:var(--card);color:var(--text);padding:10px 15px;
    transition:border-color .18s,color .18s,transform .1s,background .18s}
  .btn:hover{border-color:var(--blue);color:var(--blue)}
  .btn:active{transform:translateY(1px)}
  .btn::after{content:"";position:absolute;inset:0;background:var(--sheen);transform:translateX(-130%);transition:transform .7s ease}
  .btn:hover::after{transform:translateX(130%)}
  .btn.on{border-color:var(--blue);background:var(--row-now);color:var(--blue)}
  .btn.main{background:linear-gradient(135deg,var(--sky),var(--deep));border-color:var(--sky);color:#fff;
    font-weight:600;padding:11px 22px;box-shadow:0 6px 18px rgba(29,155,240,.30)}
  .btn.main:hover{color:#fff}
  .btn.main::after{background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.4) 48%,transparent 62%);
    transform:translateX(-130%);animation:btnshine 4.2s ease-in-out infinite}
  @keyframes btnshine{0%{transform:translateX(-130%)}45%,100%{transform:translateX(130%)}}
  .btn.main:disabled{opacity:.42;cursor:not-allowed;box-shadow:none}
  .btn.main:disabled::after{animation:none}
  select.btn{appearance:none;padding-inline-end:30px;
    background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 16px) 19px,calc(100% - 11px) 19px;background-size:5px 5px;background-repeat:no-repeat}
  html[dir="rtl"] select.btn{background-position:16px 19px,21px 19px}
  select.btn option{background:var(--card);color:var(--text)}

  @media (prefers-reduced-motion:reduce){
    .hero::after,.wave rect,.hero h1,.card::before,.btn.main::after,.fill{animation:none}
    .hero h1{background-position:0 0}
  }

  /* ============ progress ============ */
  .work{display:none;margin-top:15px}
  .work.on{display:block}
  .work .lbl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:9px}
  .work .lbl b{color:var(--blue);font-weight:600;font-variant-numeric:tabular-nums;font-family:var(--ui)}
  .track{height:4px;border-radius:4px;background:var(--edge-soft);overflow:hidden;position:relative}
  .fill{position:absolute;inset-block:0;inset-inline-start:0;width:0;border-radius:4px;
    background:linear-gradient(90deg,var(--deep),var(--sky),var(--deep));background-size:200% 100%;
    animation:flow 1.8s linear infinite;transition:width .35s ease}
  @keyframes flow{0%{background-position:0 0}100%{background-position:200% 0}}

  /* ============ audio deck ============ */
  .deck{display:none;align-items:center;gap:12px;margin-top:14px}
  .deck.on{display:flex}
  .play{flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:1px solid var(--sky);cursor:pointer;
    background:linear-gradient(135deg,var(--sky),var(--deep));color:#fff;font-size:14px;display:grid;place-items:center;
    box-shadow:0 4px 16px rgba(29,155,240,.32)}
  .seek{flex:1;height:4px;border-radius:4px;background:var(--edge-soft);cursor:pointer;position:relative}
  .seek i{position:absolute;inset-block:0;inset-inline-start:0;width:0;border-radius:4px;
    background:linear-gradient(90deg,var(--deep),var(--sky))}
  .tm{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto;direction:ltr}

  /* ============ toolbar ============ */
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--edge)}
  .spacer{flex:1}
  .find{background:var(--input);border:1px solid var(--edge);border-radius:9px;padding:9px 12px;
    color:var(--text);font-size:12.5px;outline:none;width:145px}
  .find:focus{border-color:var(--blue)}

  /* ============ transcript ============ */
  .script{margin-top:4px}
  .row{display:flex;gap:12px;align-items:flex-start;padding:9px 6px;border-radius:9px;
    border-inline-start:2px solid transparent;transition:background .15s}
  .row:hover{background:var(--row-hover)}
  .row.now{background:var(--row-now);border-inline-start-color:var(--blue)}
  .row.dim{opacity:.3}
  .row.hit{background:var(--row-hover)}
  .jump{flex:0 0 auto;background:none;border:0;cursor:pointer;color:var(--muted);font-size:11.5px;
    font-variant-numeric:tabular-nums;padding:5px 2px 0;direction:ltr;font-family:var(--ui)}
  .jump:hover{color:var(--blue)}
  .hide-stamps .jump{display:none}
  .t{flex:1;font-size:16px;line-height:1.6;outline:none;border-radius:6px;padding:2px 6px;min-width:0}
  .t:focus{background:var(--input);box-shadow:inset 0 0 0 1px var(--blue)}
  .script.rtl .t{font-family:var(--urdu);line-height:2.55}
  .script.rtl .jump{padding-top:13px}
  .script.ltr .t{font-family:var(--ui)}
  .kill{flex:0 0 auto;background:none;border:0;color:var(--muted);cursor:pointer;font-size:15px;
    padding:3px 5px;opacity:.25;transition:opacity .15s,color .15s}
  .row:hover .kill{opacity:1}
  .kill:hover{color:var(--bad)}

  /* ============ notes ============ */
  .note{display:none;margin-top:14px;border-radius:11px;border:1px solid var(--edge);
    border-inline-start:2px solid var(--sky);background:var(--input);padding:14px 16px;
    font-size:13.5px;line-height:1.75;color:var(--muted)}
  .note.on{display:block}
  .note.bad{border-inline-start-color:var(--bad)}
  .note b{color:var(--text);font-weight:600}
  .stat{display:none;margin-top:12px;font-size:12px;color:var(--muted)}
  .stat.on{display:block}
  .stat b{color:var(--blue);font-weight:600;font-family:var(--ui)}
  footer{margin-top:26px;text-align:center;font-size:11px;color:var(--muted);opacity:.75}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px}
</style>
</head>

        <p data-k="sub"></p>
      </div>
    </div>
  </header>

  <section class="card">
    <p class="cap" data-k="capAudio"></p>

    <div class="opts" style="margin-top:0;margin-bottom:12px">
      <button class="btn on" id="srcFileBtn" type="button" data-k="srcFile"></button>
      <button class="btn" id="srcLinkBtn" type="button" data-k="srcLink"></button>
    </div>

    <label class="drop" id="dropWrap">
      <input type="file" id="media" accept="audio/*,video/*" />
      <b data-k="dropTitle"></b>
      <span data-k="dropSub"></span>
    </label>

    <div id="linkWrap" style="display:none">
      <input class="find" id="ytUrl" type="url" style="width:100%;box-sizing:border-box;padding:12px" />
    </div>

    <div class="picked" id="picked"></div>

    <div class="opts">
      <select class="btn" id="tlang"></select>
      <button class="btn main" id="make" disabled data-k="make"></button>
    </div>

    <div class="work" id="work">
      <div class="lbl"><span id="workTxt"></span><b id="workPct">0%</b></div>
      <div class="track"><i class="fill" id="workFill"></i></div>
    </div>

    <div class="note" id="note"></div>
  </section>

  <section class="card" id="stage" style="display:none">
    <p class="cap" data-k="capScript"></p>

    <div class="deck" id="deck">
      <button class="play" id="play">▶</button>
      <div class="seek" id="seek"><i id="seekFill"></i></div>
      <span class="tm" id="tm">0:00</span>
      <audio id="audio" preload="metadata"></audio>
    </div>

    <div class="bar">
      <button class="btn on" id="stampBtn" data-k="time"></button>
      <button class="btn on" id="syncBtn" data-k="scroll"></button>
      <div class="spacer"></div>
      <input class="find" id="find" type="search" />
      <button class="btn" id="copyBtn" data-k="copy"></button>
      <button class="btn" id="txtBtn">.txt</button>
      <button class="btn" id="srtBtn">.srt</button>
    </div>

    <div class="stat on" id="stat"></div>
    <div class="script" id="script"></div>
  </section>

  <footer data-k="foot"></footer>
</div>

<script>
const $ = (id) => document.getElementById(id);
const CHUNK_SEC = 100, SR = 16000;

/* ================= i18n ================= */
const STR = {
  ur: {
    title:"ایل ڈبلیو ایف سوشل میڈیا سیل ٹرانسکرائبر",
    sub:"لاثانی ویلفیئر فاؤنڈیشن (رجسٹرڈ) انٹرنیشنل",
    capAudio:"آڈیو فائل",
    srcFile:"فائل اپ لوڈ کریں",
    srcLink:"یوٹیوب لنک",
    dropTitle:"آڈیو فائل منتخب کریں",
    dropSub:"mp3 · m4a · wav · ogg — آواز سے متن بن جائے گا",
    linkPlaceholder:"یوٹیوب ویڈیو کا لنک یہاں لگائیں",
    fetchingLink:"یوٹیوب سے آواز نکالی جا رہی ہے…",
    noLink:"پہلے یوٹیوب لنک لگائیں۔",
    make:"متن بنائیں",
    capScript:"متن — کسی بھی سطر پر ٹیپ کر کے درست کریں",
    time:"وقت", scroll:"خودکار اسکرول", copy:"کاپی", copied:"کاپی ہو گیا", copyFail:"کاپی نہیں ہوا",
    find:"تلاش کریں",
    foot:"آواز سے متن · ایل ڈبلیو ایف سوشل میڈیا سیل",
    prep:"آواز پڑھی جا رہی ہے…", prep2:"آواز تیار کی جا رہی ہے…",
    part:(a,b)=>"حصہ "+a+" / "+b+" لکھا جا رہا ہے…",
    done:"مکمل",
    okMsg:"ہو گیا۔ اب کسی بھی سطر پر ٹیپ کر کے اسے درست کر سکتے ہیں — وقت پر ٹیپ کریں تو آواز وہیں سے چلے گی۔",
    silent:"آواز میں کوئی بات پہچانی نہیں گئی۔ کیا فائل خاموش ہے؟",
    decodeErr:"اس فائل کی آواز پڑھی نہیں جا سکی۔ mp3 یا m4a آزمائیں۔",
    noBackend:"بیک اینڈ نہیں ملا — ایپ کو Vercel پر deploy کرنا ہو گا۔",
    stopped:"متن بننا رُک گیا۔",
    longHint:"اگر فائل بہت لمبی ہے تو فون کی میموری کم پڑ جاتی ہے — ایک گھنٹے سے لمبی فائلوں کے لیے Colab نوٹ بک بہتر ہے۔",
    stat:(l,w)=>l+" سطریں · "+w+" الفاظ",
    langs:[["ur","اردو"],["auto","خود پہچانیں"],["ar","عربی"],["hi","ہندی"],["pa","پنجابی"],["ps","پشتو"],["sd","سندھی"],["fa","فارسی"],["en","انگریزی"]],
    del:"سطر ہٹائیں", jumpT:"یہاں سے سنیں"
  },
  en: {
    title:"LWF Social Media Cell Transcriber",
    sub:"Lasani Welfare Foundation (Reg.) International",
    capAudio:"Audio file",
    srcFile:"Upload file",
    srcLink:"YouTube link",
    dropTitle:"Choose an audio file",
    dropSub:"mp3 · m4a · wav · ogg — speech becomes text",
    linkPlaceholder:"Paste a YouTube video link here",
    fetchingLink:"Fetching audio from YouTube…",
    noLink:"Paste a YouTube link first.",
    make:"Create transcript",
    capScript:"Transcript — tap any line to correct it",
    time:"Time", scroll:"Auto-scroll", copy:"Copy", copied:"Copied", copyFail:"Copy failed",
    find:"Search",
    foot:"Speech to text · LWF Social Media Cell",
    prep:"Reading the audio…", prep2:"Preparing the audio…",
    part:(a,b)=>"Writing part "+a+" of "+b+"…",
    done:"Done",
    okMsg:"Ready. Tap any line to correct it — tap a timestamp to hear that moment.",
    silent:"No speech was recognised. Is the file silent?",
    decodeErr:"This file's audio could not be read. Try mp3 or m4a.",
    noBackend:"Backend not found — the app needs to be deployed on Vercel.",
    stopped:"Transcription stopped.",
    longHint:"Very long files run the phone out of memory — for anything over an hour, use the Colab notebook.",
    stat:(l,w)=>l+" lines · "+w+" words",
    langs:[["ur","Urdu"],["auto","Detect automatically"],["ar","Arabic"],["hi","Hindi"],["pa","Punjabi"],["ps","Pashto"],["sd","Sindhi"],["fa","Farsi"],["en","English"]],
    del:"Remove line", jumpT:"Play from here"
  }
};
let UI = "ur";
const T = () => STR[UI];

function applyUI(){
  const d = STR[UI];
  document.documentElement.lang = UI;
  document.documentElement.dir = UI === "ur" ? "rtl" : "ltr";
  document.querySelectorAll("[data-k]").forEach((el) => {
    const v = d[el.dataset.k];
    if (typeof v === "string") el.textContent = v;
  });
  $("find").placeholder = d.find;
  $("ytUrl").placeholder = d.linkPlaceholder;
  $("langSw").textContent = UI === "ur" ? "EN" : "اردو";
  const sel = $("tlang"), keep = sel.value || "ur";
  sel.innerHTML = d.langs.map(([v, n]) => '<option value="' + v + '">' + n + "</option>").join("");
  sel.value = keep;
  if (segments.length) stats();
}
$("langSw").onclick = () => { UI = UI === "ur" ? "en" : "ur"; applyUI(); if (segments.length) render(); };

/* ================= theme ================= */
let theme = "light";
function applyTheme(){
  document.documentElement.dataset.theme = theme;
  $("themeSw").textContent = theme === "light" ? "🌙" : "☀️";
}
$("themeSw").onclick = () => { theme = theme === "light" ? "dark" : "light"; applyTheme(); };

/* ================= state ================= */
let segments = [], activeIdx = -1, ticker = null;
let autoScroll = true, showStamps = true, lang = "ur";
let mediaFile = null, mediaUrl = null, editing = false;
let sourceMode = "file";

/* ---------- source toggle (file vs YouTube link) ---------- */
const isYouTubeUrl = (u) => /^(https?:\/\/)?(www\.)?(m\.)?(youtube\.com|youtu\.be)\//i.test(u.trim());
function updateMakeEnabled(){
  $("make").disabled = sourceMode === "file" ? !mediaFile : !isYouTubeUrl($("ytUrl").value || "");
}
$("srcFileBtn").onclick = () => {
  sourceMode = "file";
  $("srcFileBtn").classList.add("on"); $("srcLinkBtn").classList.remove("on");
  $("dropWrap").style.display = ""; $("linkWrap").style.display = "none";
  mediaFile = null; $("picked").textContent = "";
  updateMakeEnabled();
};
$("srcLinkBtn").onclick = () => {
  sourceMode = "link";
  $("srcLinkBtn").classList.add("on"); $("srcFileBtn").classList.remove("on");
  $("dropWrap").style.display = "none"; $("linkWrap").style.display = "";
  mediaFile = null; $("picked").textContent = "";
  updateMakeEnabled();
};
$("ytUrl").addEventListener("input", () => { mediaFile = null; $("picked").textContent = ""; updateMakeEnabled(); });

/* ---------- header waveform ---------- */
(function drawWave(){
  const svg = $("wave"), bars = 48, w = 1000, h = 100;
  svg.setAttribute("viewBox", "0 0 " + w + " " + h);
  let s = "";
  for (let i = 0; i < bars; i++){
    const bw = 6, gap = w / bars, hh = 26 + Math.abs(Math.sin(i * 0.7)) * 54;
    s += '<rect x="' + (i*gap + (gap-bw)/2).toFixed(1) + '" y="' + ((h-hh)/2).toFixed(1) +
         '" width="' + bw + '" height="' + hh.toFixed(1) + '" rx="3" style="animation-delay:' +
         (-(i % 11) * 0.14).toFixed(2) + 's"/>';
  }
  svg.innerHTML = s;
})();

/* ---------- helpers ---------- */
const clock = (sec) => {
  const s = Math.max(0, Math.floor(sec || 0));
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), r = s%60;
  return (h ? h + ":" : "") + String(m).padStart(h ? 2 : 1, "0") + ":" + String(r).padStart(2, "0");
};
const srtClock = (sec) => {
  const ms = Math.round((sec || 0) * 1000);
  return [Math.floor(ms/3600000), Math.floor(ms%3600000/60000), Math.floor(ms%60000/1000)]
    .map((n) => String(n).padStart(2, "0")).join(":") + "," + String(ms%1000).padStart(3, "0");
};
const isRTL = (c) => /^(ur|ar|fa|ps|sd|he|ku|pa)/i.test(c || "");
function say(html, bad){ const n = $("note"); n.innerHTML = html; n.className = "note on" + (bad ? " bad" : ""); }
const hush = () => { $("note").className = "note"; };
function progress(pct, msg){
  $("work").className = "work on";
  $("workFill").style.width = Math.round(pct) + "%";
  $("workPct").textContent = Math.round(pct) + "%";
  if (msg) $("workTxt").textContent = msg;
}
function stats(){
  const w = segments.reduce((n, s) => n + s.text.trim().split(/\s+/).filter(Boolean).length, 0);
  $("stat").textContent = T().stat(segments.length, w);
}

/* ---------- audio deck ---------- */
const audio = () => $("audio");
function mountAudio(file){
  if (mediaUrl) URL.revokeObjectURL(mediaUrl);
  mediaUrl = URL.createObjectURL(file);
  const a = audio();
  a.src = mediaUrl;
  $("deck").classList.add("on");
  a.onplay = () => { $("play").textContent = "❚❚"; };
  a.onpause = () => { $("play").textContent = "▶"; };
  a.ontimeupdate = () => {
    $("seekFill").style.width = (a.duration ? (a.currentTime/a.duration)*100 : 0) + "%";
    $("tm").textContent = clock(a.currentTime);
  };
  clearInterval(ticker);
  ticker = setInterval(() => {
    if (!segments.length || editing || a.paused) return;
    let i = -1;
    for (let k = 0; k < segments.length; k++){ if (segments[k].start <= a.currentTime + 0.15) i = k; else break; }
    if (i !== activeIdx) highlight(i);
  }, 250);
}
$("play").onclick = () => { const a = audio(); a.paused ? a.play() : a.pause(); };
$("seek").onclick = (e) => {
  const a = audio(); if (!a.duration) return;
  const r = e.currentTarget.getBoundingClientRect();
  let f = (e.clientX - r.left) / r.width;
  if (document.documentElement.dir === "rtl") f = 1 - f;
  a.currentTime = f * a.duration;
};
function seek(t){ const a = audio(); if (!a.src) return; a.currentTime = t; a.play(); }
function highlight(i){
  const p = document.querySelector(".row.now");
  if (p) p.classList.remove("now");
  activeIdx = i;
  if (i < 0) return;
  const el = $("r" + i); if (!el) return;
  el.classList.add("now");
  if (autoScroll){
    const b = el.getBoundingClientRect();
    if (b.top < 80 || b.bottom > window.innerHeight - 30) el.scrollIntoView({ block:"center", behavior:"smooth" });
  }
}

/* ---------- render ---------- */
function render(){
  const rtl = isRTL(lang);
  const box = $("script");
  box.className = "script " + (rtl ? "rtl" : "ltr") + (showStamps ? "" : " hide-stamps");
  box.dir = rtl ? "rtl" : "ltr";
  box.innerHTML = "";
  const frag = document.createDocumentFragment();
  segments.forEach((s, i) => {
    const row = document.createElement("div");
    row.className = "row"; row.id = "r" + i;

    const jump = document.createElement("button");
    jump.className = "jump"; jump.type = "button"; jump.textContent = clock(s.start); jump.title = T().jumpT;
    jump.onclick = () => { seek(s.start); highlight(i); };

    const t = document.createElement("div");
    t.className = "t"; t.contentEditable = "true"; t.spellcheck = false; t.textContent = s.text;
    t.onfocus = () => { editing = true; };
    t.onblur = () => { editing = false; segments[i].text = t.textContent.trim(); stats(); };
    t.onkeydown = (e) => { if (e.key === "Escape") t.blur(); };

    const kill = document.createElement("button");
    kill.className = "kill"; kill.type = "button"; kill.textContent = "×"; kill.title = T().del;
    kill.onclick = () => { segments.splice(i, 1); render(); };

    row.append(jump, t, kill);
    frag.appendChild(row);
  });
  box.appendChild(frag);
  activeIdx = -1;
  stats();
}

/* ---------- audio → 16k mono ---------- */
function wavBytes(f32){
  const n = f32.length, buf = new ArrayBuffer(44 + n*2), dv = new DataView(buf);
  const str = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o+i, s.charCodeAt(i)); };
  str(0,"RIFF"); dv.setUint32(4, 36+n*2, true); str(8,"WAVEfmt ");
  dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,1,true);
  dv.setUint32(24,SR,true); dv.setUint32(28,SR*2,true); dv.setUint16(32,2,true); dv.setUint16(34,16,true);
  str(36,"data"); dv.setUint32(40,n*2,true);
  let o = 44;
  for (let i = 0; i < n; i++, o += 2){
    const v = Math.max(-1, Math.min(1, f32[i]));
    dv.setInt16(o, v < 0 ? v*0x8000 : v*0x7FFF, true);
  }
  return buf;
}
async function toMono16k(file){
  progress(4, T().prep);
  const raw = await file.arrayBuffer();
  const AC = window.AudioContext || window.webkitAudioContext;
  const ctx = new AC();
  let dec;
  try { dec = await ctx.decodeAudioData(raw); }
  catch { ctx.close(); throw new Error(T().decodeErr); }
  ctx.close();
  progress(13, T().prep2);
  const off = new OfflineAudioContext(1, Math.ceil(dec.duration * SR), SR);
  const src = off.createBufferSource();
  src.buffer = dec; src.connect(off.destination); src.start();
  return (await off.startRendering()).getChannelData(0);
}

async function fetchFromYouTube(url){
  $("make").disabled = true;
  hush();
  progress(3, T().fetchingLink);
  const r = await fetch("/api/fetch-audio?url=" + encodeURIComponent(url));
  if (!r.ok) {
    let msg = T().stopped;
    try { const data = await r.json(); if (data && data.message) msg = data.message; } catch (e) {}
    throw new Error(msg);
  }
  const blob = await r.blob();
  const titleHeader = r.headers.get("X-Video-Title");
  const title = titleHeader ? decodeURIComponent(titleHeader) : "youtube-audio";
  const file = new File([blob], title.replace(/[\\/:*?"<>|]/g, "_") + ".webm", { type: blob.type || "audio/webm" });
  mediaFile = file;
  $("picked").textContent = file.name + "  ·  " + (file.size/1048576).toFixed(1) + " MB";
  return file;
}

async function run(){
  if (sourceMode === "link" && !mediaFile) {
    const url = ($("ytUrl").value || "").trim();
    if (!isYouTubeUrl(url)) { say("<b>" + T().noLink + "</b>", true); return; }
    try {
      await fetchFromYouTube(url);
    } catch (err) {
      $("work").className = "work";
      say("<b>" + (err.message || T().stopped) + "</b>", true);
      updateMakeEnabled();
      return;
    }
  }
  if (!mediaFile) return;
  hush();
  lang = $("tlang").value;
  segments = []; $("script").innerHTML = "";
  $("make").disabled = true;
  $("stage").style.display = "";
  mountAudio(mediaFile);
  try {
    const pcm = await toMono16k(mediaFile);
    const step = CHUNK_SEC * SR, parts = Math.ceil(pcm.length / step), all = [];
    let detected = lang === "auto" ? null : lang;
    for (let i = 0; i < parts; i++){
      progress(17 + (i/parts)*79, T().part(i+1, parts));
      const r = await fetch("/api/transcribe?offset=" + (i*CHUNK_SEC) + "&lang=" + encodeURIComponent(lang), {
        method:"POST", headers:{ "Content-Type":"application/octet-stream" },
        body: wavBytes(pcm.subarray(i*step, Math.min(pcm.length, (i+1)*step)))
      });
      if (!(r.headers.get("content-type") || "").includes("json")) throw new Error(T().noBackend);
      const data = await r.json();
      if (!r.ok) throw new Error(data.message || T().stopped);
      if (!detected && data.language) detected = data.language;
      lang = detected || "ur";
      all.push.apply(all, data.segments || []);
      segments = all.slice();
      render();
    }
    progress(100, T().done);
    setTimeout(() => { $("work").className = "work"; }, 1400);
    say(segments.length ? T().okMsg : T().silent, !segments.length);
  } catch (err) {
    $("work").className = "work";
    say("<b>" + (err.message || T().stopped) + "</b><br>" + T().longHint, true);
  } finally { $("make").disabled = false; }
}

$("media").addEventListener("change", (e) => {
  mediaFile = e.target.files[0] || null;
  $("make").disabled = !mediaFile;
  $("picked").textContent = mediaFile ? mediaFile.name + "  ·  " + (mediaFile.size/1048576).toFixed(1) + " MB" : "";
  hush();
});
$("make").onclick = run;

/* ---------- toolbar ---------- */
$("stampBtn").onclick = (e) => {
  showStamps = !showStamps;
  e.currentTarget.classList.toggle("on", showStamps);
  $("script").classList.toggle("hide-stamps", !showStamps);
};
$("syncBtn").onclick = (e) => { autoScroll = !autoScroll; e.currentTarget.classList.toggle("on", autoScroll); };
$("find").addEventListener("input", (e) => {
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll(".row").forEach((row, i) => {
    row.classList.remove("hit", "dim");
    if (!q) return;
    if (segments[i] && segments[i].text.toLowerCase().includes(q)) row.classList.add("hit");
    else row.classList.add("dim");
  });
  const first = document.querySelector(".row.hit");
  if (q && first) first.scrollIntoView({ block:"center", behavior:"smooth" });
});

const plain = () => segments.map((s) => (showStamps ? "[" + clock(s.start) + "] " : "") + s.text).join("\n");
const srt = () => segments.map((s, i) =>
  (i+1) + "\n" + srtClock(s.start) + " --> " + srtClock(s.start + (s.dur || 2)) + "\n" + s.text + "\n").join("\n");
function save(name, body){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([body], { type:"text/plain;charset=utf-8" }));
  a.download = name; a.click(); URL.revokeObjectURL(a.href);
}
const base = () => (mediaFile ? mediaFile.name.replace(/\.[^.]+$/, "") : "transcript");
$("copyBtn").onclick = async (e) => {
  if (!segments.length) return;
  const b = e.currentTarget;
  try { await navigator.clipboard.writeText(plain()); b.textContent = T().copied; }
  catch { b.textContent = T().copyFail; }
  setTimeout(() => { b.textContent = T().copy; }, 1600);
};
$("txtBtn").onclick = () => segments.length && save(base() + ".txt", plain());
$("srtBtn").onclick = () => segments.length && save(base() + ".srt", srt());
window.addEventListener("beforeunload", (e) => { if (segments.length){ e.preventDefault(); e.returnValue = ""; } });

applyTheme();
applyUI();
</script>
</body>
</html>
