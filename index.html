<!DOCTYPE html>
<html lang="ur" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>LWF SMC Transcriber</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter+Tight:wght@400;500;600&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* ---------- LIGHT (default) ---------- */
  :root{
    --bg:#EEF4FB; --glow:#DCEAF9;
    --card:#FFFFFF; --card-2:#F7FAFE;
    --edge:#D5E3F2; --edge-soft:#E6EFF9;
    --blue:#0F76C4; --sky:#1D9BF0; --deep:#0A5D9E;
    --text:#0B2237; --muted:#5D7B96;
    --bad:#C2452A;
    --sheen:linear-gradient(105deg,transparent 38%,rgba(29,155,240,.20) 48%,rgba(29,155,240,.05) 56%,transparent 66%);
    --shadow:0 10px 30px rgba(11,45,80,.10);
    --row-hover:rgba(29,155,240,.06);
    --row-now:rgba(29,155,240,.13);
    --input:#F4F8FD;
    --ui:"Inter Tight",system-ui,sans-serif;
    --disp:"Bricolage Grotesque",system-ui,sans-serif;
    --urdu:"Noto Nastaliq Urdu",serif;
  }
  /* ---------- DARK ---------- */
  [data-theme="dark"]{
    --bg:#05101F; --glow:#12304F;
    --card:#0B1D31; --card-2:#102944;
    --edge:#1B3A5C; --edge-soft:#15304C;
    --blue:#1D9BF0; --sky:#7CC6FF; --deep:#0E6FB8;
    --text:#EAF4FF; --muted:#7C9AB8;
    --bad:#FF8A6B;
    --sheen:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.28) 48%,rgba(255,255,255,.05) 56%,transparent 66%);
    --shadow:0 14px 36px rgba(0,0,0,.42);
    --row-hover:rgba(124,198,255,.06);
    --row-now:rgba(29,155,240,.16);
    --input:rgba(5,16,31,.7);
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(900px 460px at 50% -8%,var(--glow) 0%,transparent 62%),var(--bg);
    color:var(--text);font-family:var(--ui);-webkit-font-smoothing:antialiased;min-height:100vh;
    transition:background-color .3s,color .3s;
  }
  html[lang="ur"] body{font-family:var(--urdu)}
  html[lang="ur"] .num,html[lang="ur"] .tm,html[lang="ur"] .jump{font-family:var(--ui)}
  .wrap{max-width:900px;margin:0 auto;padding:16px 14px 70px}

  /* ============ hero ============ */
  .hero{
    position:relative;overflow:hidden;border-radius:18px;
    background:linear-gradient(160deg,#14375C 0%,#0B1D31 55%,#061523 100%);
    border:1px solid rgba(124,198,255,.22);
    padding:20px 18px;box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.08);
  }
  .hero::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.26) 48%,rgba(255,255,255,.05) 56%,transparent 66%);
    transform:translateX(-120%);animation:sweep 6.5s ease-in-out infinite}
  @keyframes sweep{0%{transform:translateX(-120%)}55%,100%{transform:translateX(120%)}}
  .wave{position:absolute;inset:0;width:100%;height:100%;opacity:.17;pointer-events:none}
  .wave rect{fill:#7CC6FF;transform-origin:center;animation:pulse 1.5s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scaleY(.22)}50%{transform:scaleY(1)}}
  .hero-in{position:relative;z-index:2;display:flex;align-items:center;gap:14px}
  .crest{flex:0 0 auto;width:70px;height:70px;border-radius:50%;overflow:hidden;
    background:radial-gradient(circle,#fff 62%,rgba(124,198,255,.25) 100%);
    box-shadow:0 0 0 1px rgba(124,198,255,.45),0 0 24px rgba(29,155,240,.4)}
  .crest img{width:100%;height:100%;object-fit:contain;display:block}
  .hero h1{font-family:var(--disp);font-weight:800;font-size:clamp(19px,5.2vw,28px);margin:0;
    letter-spacing:-.02em;line-height:1.1;
    background:linear-gradient(92deg,#FFFFFF 12%,#7CC6FF 52%,#FFFFFF 88%);background-size:220% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;animation:glide 7s ease-in-out infinite}
  @keyframes glide{0%,100%{background-position:0% 0}50%{background-position:100% 0}}
  html[dir="rtl"] .hero h1{text-align:right}
  html[lang="ur"] .hero h1{font-family:var(--urdu);font-weight:600;letter-spacing:0;
    line-height:1.95;font-size:clamp(16px,4.4vw,23px);padding-block:2px}
  .hero p{margin:5px 0 0;font-size:11.5px;letter-spacing:.05em;color:#9DBBD6}
  html[lang="en"] .hero p{letter-spacing:.14em;text-transform:uppercase}
  .switches{position:absolute;z-index:3;top:14px;inset-inline-end:14px;display:flex;gap:6px}
  .sw{border:1px solid rgba(124,198,255,.35);background:rgba(5,16,31,.5);color:#DCEDFF;
    border-radius:8px;font-size:12px;padding:6px 10px;cursor:pointer;font-family:var(--ui);
    backdrop-filter:blur(4px);transition:border-color .2s,background .2s}
  .sw:hover{border-color:#7CC6FF;background:rgba(29,155,240,.25)}

  /* ============ cards ============ */
  .card{position:relative;margin-top:16px;border-radius:14px;border:1px solid var(--edge);
    background:linear-gradient(180deg,var(--card),var(--card-2));padding:18px 16px;overflow:hidden;
    box-shadow:var(--shadow)}
  .card::before{content:"";position:absolute;inset-block:0 auto;inset-inline:0;height:1px;
    background:linear-gradient(90deg,transparent,var(--sky),transparent);
    background-size:220% 100%;animation:edge 5s linear infinite}
  @keyframes edge{0%{background-position:-110% 0}100%{background-position:110% 0}}
  .cap{font-size:11.5px;letter-spacing:.06em;color:var(--muted);margin:0 0 12px}
  html[lang="en"] .cap{letter-spacing:.18em;text-transform:uppercase;font-size:11px}

  .drop{display:block;border:1px dashed var(--edge);border-radius:11px;padding:22px 16px;text-align:center;
    cursor:pointer;transition:border-color .2s,background .2s}
  .drop:hover{border-color:var(--blue);background:var(--row-hover)}
  .drop input{display:none}
  .drop b{display:block;font-size:17px;margin-bottom:6px;font-weight:600}
  html[lang="en"] .drop b{font-family:var(--disp)}
  html[lang="ur"] .drop b{line-height:2.1}
  .drop span{font-size:12.5px;color:var(--muted)}
  .picked{margin-top:12px;font-size:13px;color:var(--blue);word-break:break-all;direction:ltr}
  html[dir="rtl"] .picked{text-align:right}

  .url-box{margin-top:12px;display:flex;gap:8px}
  .url-input{flex:1;background:var(--input);border:1px solid var(--edge);border-radius:9px;padding:9px 12px;color:var(--text);font-size:13px;outline:none;direction:ltr}
  .url-input:focus{border-color:var(--blue)}

  .opts{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:14px}
  button,select,input{font-family:inherit}
  .btn{position:relative;overflow:hidden;cursor:pointer;border-radius:9px;font-size:13.5px;font-weight:500;
    border:1px solid var(--edge);background:var(--card);color:var(--text);padding:10px 15px;
    transition:border-color .18s,color .18s,transform .1s,background .18s}
  .btn:hover{border-color:var(--blue);color:var(--blue)}
  .btn:active{transform:translateY(1px)}
  .btn::after{content:"";position:absolute;inset:0;background:var(--sheen);transform:translateX(-130%);transition:transform .7s ease}
  .btn:hover::after{transform:translateX(130%)}
  .btn.on{border-color:var(--blue);background:var(--row-now);color:var(--blue)}
  .btn.main{background:linear-gradient(135deg,var(--sky),var(--deep));border-color:var(--sky);color:#fff;
    font-weight:600;padding:11px 22px;box-shadow:0 6px 18px rgba(29,155,240,.30)}
  .btn.main:hover{color:#fff}
  .btn.main::after{background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.4) 48%,transparent 62%);
    transform:translateX(-130%);animation:btnshine 4.2s ease-in-out infinite}
  @keyframes btnshine{0%{transform:translateX(-130%)}45%,100%{transform:translateX(130%)}}
  .btn.main:disabled{opacity:.42;cursor:not-allowed;box-shadow:none}
  .btn.main:disabled::after{animation:none}
  select.btn{appearance:none;padding-inline-end:30px;
    background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 16px) 19px,calc(100% - 11px) 19px;background-size:5px 5px;background-repeat:no-repeat}
  html[dir="rtl"] select.btn{background-position:16px 19px,21px 19px}
  select.btn option{background:var(--card);color:var(--text)}

  @media (prefers-reduced-motion:reduce){
    .hero::after,.wave rect,.hero h1,.card::before,.btn.main::after,.fill{animation:none}
    .hero h1{background-position:0 0}
  }

  /* ============ progress ============ */
  .work{display:none;margin-top:15px}
  .work.on{display:block}
  .work .lbl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:9px}
  .work .lbl b{color:var(--blue);font-weight:600;font-variant-numeric:tabular-nums;font-family:var(--ui)}
  .track{height:4px;border-radius:4px;background:var(--edge-soft);overflow:hidden;position:relative}
  .fill{position:absolute;inset-block:0;inset-inline-start:0;width:0;border-radius:4px;
    background:linear-gradient(90deg,var(--deep),var(--sky),var(--deep));background-size:200% 100%;
    animation:flow 1.8s linear infinite;transition:width .35s ease}
  @keyframes flow{0%{background-position:0 0}100%{background-position:200% 0}}

  /* ============ audio deck ============ */
  .deck{display:none;align-items:center;gap:12px;margin-top:14px}
  .deck.on{display:flex}
  .play{flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:1px solid var(--sky);cursor:pointer;
    background:linear-gradient(135deg,var(--sky),var(--deep));color:#fff;font-size:14px;display:grid;place-items:center;
    box-shadow:0 4px 16px rgba(29,155,240,.32)}
  .seek{flex:1;height:4px;border-radius:4px;background:var(--edge-soft);cursor:pointer;position:relative}
  .seek i{position:absolute;inset-block:0;inset-inline-start:0;width:0;border-radius:4px;
    background:linear-gradient(90deg,var(--deep),var(--sky))}
  .tm{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto;direction:ltr}

  /* ============ toolbar ============ */
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--edge)}
  .spacer{flex:1}
  .find{background:var(--input);border:1px solid var(--edge);border-radius:9px;padding:9px 12px;
    color:var(--text);font-size:12.5px;outline:none;width:145px}
  .find:focus{border-color:var(--blue)}

  /* ============ transcript ============ */
  .script{margin-top:4px}
  .row{display:flex;gap:12px;align-items:flex-start;padding:9px 6px;border-radius:9px;
    border-inline-start:2px solid transparent;transition:background .15s}
  .row:hover{background:var(--row-hover)}
  .row.now{background:var(--row-now);border-inline-start-color:var(--blue)}
  .row.dim{opacity:.3}
  .row.hit{background:var(--row-hover)}
  .jump{flex:0 0 auto;background:none;border:0;cursor:pointer;color:var(--muted);font-size:11.5px;
    font-variant-numeric:tabular-nums;padding:5px 2px 0;direction:ltr;font-family:var(--ui)}
  .jump:hover{color:var(--blue)}
  .hide-stamps .jump{display:none}
  .t{flex:1;font-size:16px;line-height:1.6;outline:none;border-radius:6px;padding:2px 6px;min-width:0}
  .t:focus{background:var(--input);box-shadow:inset 0 0 0 1px var(--blue)}
  .script.rtl .t{font-family:var(--urdu);line-height:2.55}
  .script.rtl .jump{padding-top:13px}
  .script.ltr .t{font-family:var(--ui)}
  .kill{flex:0 0 auto;background:none;border:0;color:var(--muted);cursor:pointer;font-size:15px;
    padding:3px 5px;opacity:.25;transition:opacity .15s,color .15s}
  .row:hover .kill{opacity:1}
  .kill:hover{color:var(--bad)}

  /* ============ notes ============ */
  .note{display:none;margin-top:14px;border-radius:11px;border:1px solid var(--edge);
    border-inline-start:2px solid var(--sky);background:var(--input);padding:14px 16px;
    font-size:13.5px;line-height:1.75;color:var(--muted)}
  .note.on{display:block}
  .note.bad{border-inline-start-color:var(--bad)}
  .note b{color:var(--text);font-weight:600}
  .stat{display:none;margin-top:12px;font-size:12px;color:var(--muted)}
  .stat.on{display:block}
  .stat b{color:var(--blue);font-weight:600;font-family:var(--ui)}
  footer{margin-top:26px;text-align:center;font-size:11px;color:var(--muted);opacity:.75}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <svg class="wave" id="wave" preserveAspectRatio="none" aria-hidden="true"></svg>
    <div class="switches">
      <button class="sw" id="langSw" title="Language">EN</button>
      <button class="sw" id="themeSw" title="Theme">🌙</button>
    </div>
    <div class="hero-in">
      <div class="crest"><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAQAAAAEACAYAAABccqhmAAEAAElEQVR42uydd5hdR3n/PzNz2q3bq3ZXvVdLluVesbEBY4MdwBB6SCOkEFp+SYCQhAABQgiEFjBgmoHgDu5dtizJktW7VmW1vd9+yszvj3NXFsYQQrFkonme80he6+6995x5v/N9v28TnF6n8hLVS1b/2wDRL/GaJJAAstUrA6QAr/q7aqv/7rlrvPr7K0C+ek1WrxJQBPT/8P7qhN+tq5/ZnH6Up+4GO71OLWN/rvE8379rANqATqAL6ADaq1dd9cpWgcAB7BNA5JddGgiBAChUQWAcGAX6gWNAD3AEOAr0ASF/B6CeC2KnQeE0AJy+9ycYxs872euBGcBCYFH1mlk1+IZf4T3Nc/78efvhV9kXY1VQ6AZ2ATuBHcAhYPgXMIXTLOE0APyfut9TJ+FzDd4G5gBnAGdWrznVk/4XndL65xiv+A08Z/MLwGPqT/k/sIsB4ACwCdhQ/XM/UH4eQPhFzOf0Og0AL8olq/fZPMd/ltWT/RzgAuCsqsFbz/M7ourrn+smnCrPzzwPvRcnGPVzQesgsB54DHiyyhaCX+KemV6nAeBFddI/dwO3AOcCL6ka/cLnMfgTjV3+Djwjc8Kp/nygYIDdwFrgfuDxqitx4r1Uz2E7p9dpAHjRGP1M4ArgZcB5z+O7R8/RBH7Xn8lzRcDnAsJ4lRX8GLgH2Pc8zOC0m3AaAE4pii+JFfOp1QVcBbwKOJ84BPdcv13+HzH4XxYQ9PMwh" alt="Crest"></div>
      <div>
        <h1 id="titleTxt">LWF SMC Transcriber</h1>
        <p id="subTxt">Smart Audio & Video Transcription Engine</p>
      </div>
    </div>
  </header>

  <main class="card">
    <div class="cap" id="inputCap">آڈیو / ویڈیو فائل یا یوٹیوب لنک منتخب کریں</div>
    <label class="drop" id="dropArea">
      <input type="file" id="fileInput" accept="audio/*,video/*">
      <b id="dropTxt">فائل یہاں ڈراپ کریں یا منتخب کریں</b>
      <span id="dropHint">MP3, WAV, M4A, MP4 (زیادہ سے زیادہ 500MB)</span>
    </label>
    <div class="picked" id="pickedFile"></div>

    <div class="url-box">
      <input type="url" id="ytUrlInput" class="url-input" placeholder="یا یوٹیوب ویڈیو URL یہاں پیسٹ کریں (e.g. https://youtu.be/...)">
    </div>

    <div class="opts">
      <select class="btn" id="langSelect">
        <option value="ur">اردو (Urdu)</option>
        <option value="en">English</option>
        <option value="auto">Auto Detect</option>
      </select>
      <button class="btn main" id="startBtn">ٹرانسکرائب کریں</button>
    </div>

    <div class="work" id="workArea">
      <div class="lbl"><span id="workStatus">پراسیسنگ جاری ہے...</span><b id="workPerc">0%</b></div>
      <div class="track"><div class="fill" id="workFill"></div></div>
    </div>

    <div class="deck" id="audioDeck">
      <button class="play" id="playBtn" aria-label="Play/Pause">▶</button>
      <div class="seek" id="seekBar"><i id="seekFill"></i></div>
      <span class="tm" id="timeDisplay">00:00 / 00:00</span>
    </div>

    <div class="bar">
      <button class="btn" id="dirToggle">RTL / LTR</button>
      <button class="btn" id="stampToggle">ٹائم اسٹیمپ چھپائیں</button>
      <button class="btn" id="copyBtn">کاپی کریں</button>
      <button class="btn" id="exportTxt">TXT ڈاؤن لوڈ</button>
      <button class="btn" id="exportSrt">SRT ڈاؤن لوڈ</button>
      <div class="spacer"></div>
      <input type="text" class="find" id="searchInput" placeholder="تلاش کریں...">
    </div>

    <div class="script rtl" id="scriptContainer"></div>

    <div class="note" id="noteArea"></div>
    <div class="stat" id="statArea">کل الفاظ: <b id="wordCount">0</b> | دورانیہ: <b id="durationVal">00:00</b></div>
  </main>

  <footer>
    <span id="ftrTxt">Powered by Cloudflare Workers AI & Whisper Model</span>
  </footer>

</div>

<script>
  // Global State
  let audioBlob = null;
  let audioUrl = null;
  let audioElement = new Audio();
  let transcriptData = [];
  let isRtl = true;
  let showStamps = true;

  // Worker API Configuration
  const WORKER_URL = 'https://lwf-whisper.lwfcsc.workers.dev/';

  // UI Elements
  const fileInput = document.getElementById('fileInput');
  const ytUrlInput = document.getElementById('ytUrlInput');
  const pickedFile = document.getElementById('pickedFile');
  const startBtn = document.getElementById('startBtn');
  const workArea = document.getElementById('workArea');
  const workStatus = document.getElementById('workStatus');
  const workPerc = document.getElementById('workPerc');
  const workFill = document.getElementById('workFill');
  const noteArea = document.getElementById('noteArea');
  const audioDeck = document.getElementById('audioDeck');
  const playBtn = document.getElementById('playBtn');
  const seekBar = document.getElementById('seekBar');
  const seekFill = document.getElementById('seekFill');
  const timeDisplay = document.getElementById('timeDisplay');
  const scriptContainer = document.getElementById('scriptContainer');
  const dirToggle = document.getElementById('dirToggle');
  const stampToggle = document.getElementById('stampToggle');
  const searchInput = document.getElementById('searchInput');
  const statArea = document.getElementById('statArea');
  const wordCount = document.getElementById('wordCount');
  const durationVal = document.getElementById('durationVal');

  // File Selection
  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      audioBlob = file;
      ytUrlInput.value = '';
      pickedFile.textContent = `منتخب شدہ فائل: ${file.name} (${(file.size / (1024 * 1024)).toFixed(2)} MB)`;
      loadAudioSource(URL.createObjectURL(file));
    }
  });

  ytUrlInput.addEventListener('input', () => {
    if (ytUrlInput.value.trim() !== '') {
      fileInput.value = '';
      audioBlob = null;
      pickedFile.textContent = `یوٹیوب لنک: ${ytUrlInput.value.trim()}`;
    }
  });

  function loadAudioSource(src) {
    audioUrl = src;
    audioElement.src = src;
    audioDeck.classList.add('on');
  }

  // Helper for UI Progress updates
  function updateProgress(percent, text) {
    workArea.classList.add('on');
    workFill.style.width = percent + '%';
    workPerc.textContent = Math.round(percent) + '%';
    if (text) workStatus.textContent = text;
  }

  function hideProgress() {
    workArea.classList.remove('on');
  }

  function showError(msg) {
    noteArea.className = 'note on bad';
    noteArea.innerHTML = `<b>خرابی:</b> ${msg}`;
    hideProgress();
  }

  // Handle YouTube Audio Download via Vercel Endpoint
  async function downloadYouTubeAudio(ytUrl) {
    updateProgress(10, 'یوٹیوب آڈیو کا لنک حاصل کیا جا رہا ہے...');
    
    const cobaltRes = await fetch('/api/fetch-audio', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ url: ytUrl })
    });

    const cobaltData = await cobaltRes.json();

    if (!cobaltRes.ok || cobaltData.error || !cobaltData.url) {
      throw new Error(cobaltData.error || cobaltData.text || 'یوٹیوب آڈیو پروسیس نہیں ہو سکی۔ لنک چیک کریں۔');
    }

    updateProgress(25, 'آڈیو ڈاؤن لوڈ کی جا رہی ہے...');
    const audioRes = await fetch(cobaltData.url);
    if (!audioRes.ok) {
      throw new Error('آڈیو فائل ڈاؤن لوڈ نہیں ہو سکی۔');
    }

    updateProgress(50, 'آڈیو پراسیس کی جا رہی ہے...');
    const blob = await audioRes.blob();
    return blob;
  }

  // Main Transcription Process Flow
  startBtn.addEventListener('click', async () => {
    noteArea.className = 'note';
    noteArea.textContent = '';
    
    const ytUrl = ytUrlInput.value.trim();
    let currentBlob = audioBlob;

    if (!currentBlob && !ytUrl) {
      showError('برائے مہربانی کوئی آڈیو فائل منتخب کریں یا یوٹیوب کا درست URL درج کریں۔');
      return;
    }

    startBtn.disabled = true;

    try {
      // Step 1: Handle YouTube audio fetch if URL provided
      if (!currentBlob && ytUrl) {
        currentBlob = await downloadYouTubeAudio(ytUrl);
        loadAudioSource(URL.createObjectURL(currentBlob));
      }

      // Step 2: Send Audio Blob to Cloudflare Worker API
      updateProgress(65, 'آڈیو ٹرانسکرائب کرنے کے لیے بھیجی جا رہی ہے...');
      
      const formData = new FormData();
      formData.append('file', currentBlob, 'audio.mp3');
      formData.append('language', document.getElementById('langSelect').value);

      const response = await fetch(WORKER_URL, {
        method: 'POST',
        body: formData
      });

      if (!response.ok) {
        throw new Error(`سرور سے جواب موصول نہیں ہوا۔ (Status: ${response.status})`);
      }

      updateProgress(90, 'جواب کی فارمیٹنگ کی جا رہی ہے...');
      const result = await response.json();

      if (result.error) {
        throw new Error(result.error);
      }

      // Process segments or plain text
      if (result.vtt || result.segments) {
        transcriptData = result.segments || parseVtt(result.vtt);
      } else if (result.text) {
        transcriptData = [{ start: 0, end: audioElement.duration || 0, text: result.text }];
      } else {
        throw new Error('ٹرانسکرپشن میں کوئی متن موصول نہیں ہوا۔');
      }

      updateProgress(100, 'مکمل ہو گیا!');
      setTimeout(hideProgress, 800);
      renderTranscript(transcriptData);

    } catch (err) {
      showError(err.message || 'ٹرانسکرپشن کے دوران ایک غیر متوقع خرابی پیش آئی۔');
    } finally {
      startBtn.disabled = false;
    }
  });

  // Simple VTT Parser Fallback
  function parseVtt(vttText) {
    const lines = vttText.split('\n');
    const segments = [];
    let current = null;

    lines.forEach(line => {
      line = line.trim();
      if (line.includes('-->')) {
        const parts = line.split('-->');
        current = { start: parseTime(parts[0]), end: parseTime(parts[1]), text: '' };
      } else if (current && line !== '' && !line.startsWith('WEBVTT')) {
        current.text += (current.text ? ' ' : '') + line;
        segments.push(current);
        current = null;
      }
    });
    return segments.length ? segments : [{ start: 0, end: 0, text: vttText }];
  }

  function parseTime(tStr) {
    if (!tStr) return 0;
    const p = tStr.trim().split(':');
    if (p.length === 3) {
      return parseFloat(p[0]) * 3600 + parseFloat(p[1]) * 60 + parseFloat(p[2]);
    } else if (p.length === 2) {
      return parseFloat(p[0]) * 60 + parseFloat(p[1]);
    }
    return parseFloat(tStr) || 0;
  }

  function formatTime(sec) {
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
  }

  // Render Transcript Rows
  function renderTranscript(data) {
    scriptContainer.innerHTML = '';
    let totalWords = 0;

    data.forEach((item, idx) => {
      const words = item.text.trim().split(/\s+/).filter(Boolean);
      totalWords += words.length;

      const row = document.createElement('div');
      row.className = 'row';
      row.dataset.index = idx;
      row.dataset.start = item.start;

      row.innerHTML = `
        <button class="jump" onclick="seekAudio(${item.start})">${formatTime(item.start)}</button>
        <div class="t" contenteditable="true">${item.text}</div>
        <button class="kill" onclick="deleteRow(this)" title="حذف کریں">×</button>
      `;

      scriptContainer.appendChild(row);
    });

    statArea.classList.add('on');
    wordCount.textContent = totalWords;
    durationVal.textContent = formatTime(audioElement.duration || (data[data.length - 1]?.end || 0));
  }

  function seekAudio(time) {
    if (audioElement.src) {
      audioElement.currentTime = time;
      audioElement.play();
      playBtn.textContent = '⏸';
    }
  }

  function deleteRow(btn) {
    const row = btn.closest('.row');
    if (row) row.remove();
  }

  // Audio Deck Functionality
  playBtn.addEventListener('click', () => {
    if (!audioElement.src) return;
    if (audioElement.paused) {
      audioElement.play();
      playBtn.textContent = '⏸';
    } else {
      audioElement.pause();
      playBtn.textContent = '▶';
    }
  });

  audioElement.addEventListener('timeupdate', () => {
    if (!audioElement.duration) return;
    const pct = (audioElement.currentTime / audioElement.duration) * 100;
    seekFill.style.width = pct + '%';
    timeDisplay.textContent = `${formatTime(audioElement.currentTime)} / ${formatTime(audioElement.duration)}`;
    highlightCurrentRow(audioElement.currentTime);
  });

  seekBar.addEventListener('click', (e) => {
    if (!audioElement.duration) return;
    const rect = seekBar.getBoundingClientRect();
    const pos = (e.clientX - rect.left) / rect.width;
    audioElement.currentTime = pos * audioElement.duration;
  });

  function highlightCurrentRow(time) {
    const rows = scriptContainer.querySelectorAll('.row');
    rows.forEach(row => {
      const start = parseFloat(row.dataset.start || 0);
      const nextRow = row.nextElementSibling;
      const end = nextRow ? parseFloat(nextRow.dataset.start || Infinity) : Infinity;

      if (time >= start && time < end) {
        row.classList.add('now');
      } else {
        row.classList.remove('now');
      }
    });
  }

  // Controls & Toolbar Actions
  dirToggle.addEventListener('click', () => {
    isRtl = !isRtl;
    scriptContainer.className = `script ${isRtl ? 'rtl' : 'ltr'}`;
    document.documentElement.dir = isRtl ? 'rtl' : 'ltr';
  });

  stampToggle.addEventListener('click', () => {
    showStamps = !showStamps;
    scriptContainer.classList.toggle('hide-stamps', !showStamps);
    stampToggle.textContent = showStamps ? 'ٹائم اسٹیمپ چھپائیں' : 'ٹائم اسٹیمپ دکھائیں';
  });

  document.getElementById('copyBtn').addEventListener('click', () => {
    const texts = Array.from(scriptContainer.querySelectorAll('.t')).map(el => el.textContent.trim());
    navigator.clipboard.writeText(texts.join('\n'));
    alert('متن کلپ بورڈ پر کاپی ہو گیا ہے!');
  });

  document.getElementById('exportTxt').addEventListener('click', () => {
    const texts = Array.from(scriptContainer.querySelectorAll('.t')).map(el => el.textContent.trim());
    downloadFile(texts.join('\n'), 'transcript.txt', 'text/plain');
  });

  document.getElementById('exportSrt').addEventListener('click', () => {
    const rows = scriptContainer.querySelectorAll('.row');
    let srtContent = '';
    rows.forEach((row, i) => {
      const start = parseFloat(row.dataset.start || 0);
      const nextRow = row.nextElementSibling;
      const end = nextRow ? parseFloat(nextRow.dataset.start || start + 2) : start + 2;
      const text = row.querySelector('.t').textContent.trim();

      srtContent += `${i + 1}\n${toSrtTime(start)} --> ${toSrtTime(end)}\n${text}\n\n`;
    });
    downloadFile(srtContent, 'transcript.srt', 'text/plain');
  });

  function toSrtTime(sec) {
    const hrs = Math.floor(sec / 3600);
    const mins = Math.floor((sec % 3600) / 60);
    const secs = Math.floor(sec % 60);
    const millis = Math.floor((sec % 1) * 1000);
    return `${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')},${millis.toString().padStart(3, '0')}`;
  }

  function downloadFile(content, filename, type) {
    const a = document.createElement('a');
    const blob = new Blob([content], { type });
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  // Live Search Filter
  searchInput.addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase().trim();
    const rows = scriptContainer.querySelectorAll('.row');
    rows.forEach(row => {
      const text = row.querySelector('.t').textContent.toLowerCase();
      if (!q) {
        row.classList.remove('dim', 'hit');
      } else if (text.includes(q)) {
        row.classList.remove('dim');
        row.classList.add('hit');
      } else {
        row.classList.add('dim');
        row.classList.remove('hit');
      }
    });
  });

  // Theme & Language Toggles
  const themeSw = document.getElementById('themeSw');
  themeSw.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    themeSw.textContent = next === 'dark' ? '☀️' : '🌙';
  });

  const langSw = document.getElementById('langSw');
  langSw.addEventListener('click', () => {
    const isUr = document.documentElement.lang === 'ur';
    document.documentElement.lang = isUr ? 'en' : 'ur';
    langSw.textContent = isUr ? 'UR' : 'EN';
  });
</script>
</body>
</html>
